[project]
name = "idemerax"
version = "0.1.0"
description = "Full-stack transaction processing platform focused on data integrity, transaction consistency, idempotency, fault tolerance, and recovery from unreliable networks."
readme = "README.md"
authors = [
    { name = "Thomas Scheiermann", email = "tscheiermann.dev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.coverage.run]
branch = true
source = [
    "app",
]

[tool.coverage.report]
show_missing = true
