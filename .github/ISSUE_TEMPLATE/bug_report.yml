name: 🐛 Bug Report
description: Report a reproducible problem or unexpected behavior.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.
        Please provide enough information to help reproduce and investigate the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem clearly.
      placeholder: Explain what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the steps required to reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: Describe what should happen.

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: Describe what happened instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Error Messages
      description: Add relevant logs, stack traces, or error messages.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide relevant environment details.
      placeholder: |
        OS:
        Version:
        Browser:
        Runtime:

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any additional information, screenshots, or context.
